<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Grundfläche. Bei maskable liegt die Safe Zone im Kreis r=205 um die Mitte. -->
  <rect width="512" height="512" fill="#141A2E"/>

  <!-- Maske: linke Hälfte Torch-Gelb, rechte Hälfte dunkel abgesetzt.
       Beide Hälften teilen sich denselben Pfad, geclippt an x=256. -->
  <defs>
    <path id="mask-shape"
          d="M256 132
             c 62 0 102 10 118 26
             c 16 16 18 52 10 96
             c -8 46 -30 82 -60 104
             c -20 15 -46 22 -68 22
             s -48 -7 -68 -22
             c -30 -22 -52 -58 -60 -104
             c -8 -44 -6 -80 10 -96
             c 16 -16 56 -26 118 -26 Z"/>
    <clipPath id="left"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="right"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>

  <use href="#mask-shape" fill="#FFC53D" clip-path="url(#left)"/>
  <use href="#mask-shape" fill="#2C3A5C" clip-path="url(#right)"/>

  <!-- Augen: Kontrast jeweils gegen die eigene Hälfte. -->
  <ellipse cx="200" cy="262" rx="26" ry="32" fill="#141A2E"/>
  <ellipse cx="312" cy="262" rx="26" ry="32" fill="#FFC53D"/>

  <!-- Mund: gerader Strich, keine Miene — die Rolle bleibt offen. -->
  <rect x="206" y="330" width="100" height="16" rx="8" fill="#141A2E"/>
  <rect x="256" y="330" width="50" height="16" rx="8" fill="#E9ECF6"/>
</svg>
